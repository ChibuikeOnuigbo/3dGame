<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>model preview</title>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <style>html,body{margin:0;background:#1a1c1e;overflow:hidden}#c{width:100%;height:100vh;display:block}#lab{position:fixed;left:12px;top:12px;color:#ddd;font:14px sans-serif}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lab"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/GLTFLoader.js";
const params = new URLSearchParams(location.search);
const src = params.get("src") || "./models/flashlight/scene.gltf";
document.getElementById("lab").textContent = src;
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3034);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
cam.position.set(1.4, 1.0, 1.8);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const d = new THREE.DirectionalLight(0xfff2dd, 1.4);
d.position.set(2, 3, 2);
scene.add(d);
scene.add(new THREE.HemisphereLight(0x8899aa, 0x332211, 0.4));
const grid = new THREE.GridHelper(4, 8, 0x445, 0x334);
scene.add(grid);
const loader = new GLTFLoader();
loader.load(src, (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);
  cam.position.copy(center.clone().add(new THREE.Vector3(size * 0.7, size * 0.45, size * 0.9)));
  cam.lookAt(0, 0, 0);
  window.__previewReady = true;
  window.__previewSize = size;
}, undefined, (e) => { document.getElementById("lab").textContent = "FAIL " + e; window.__previewReady = true; });
function loop() {
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
